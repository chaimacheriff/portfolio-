name: Deploy Portfolio to VPS

on:
  push:
    branches: [main, dev, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "DEPLOY_DIR=/var/www/portfolio/prod" >> $GITHUB_ENV
            echo "APP_PORT=4000" >> $GITHUB_ENV
            echo "PM2_NAME=portfolio-prod" >> $GITHUB_ENV
          else
            echo "ENV_NAME=development" >> $GITHUB_ENV
            echo "DEPLOY_DIR=/var/www/portfolio/dev" >> $GITHUB_ENV
            echo "APP_PORT=4001" >> $GITHUB_ENV
            echo "PM2_NAME=portfolio-dev" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload files to VPS
        env:
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_USER: ${{ secrets.CONTABO_USER }}
          SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || 22 }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'public/uploads' \
            --exclude 'public/media' \
            --exclude 'data/backups' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Install & restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ENV_NAME: ${{ env.ENV_NAME }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          PM2_NAME: ${{ env.PM2_NAME }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || 22 }}
          envs: ENV_NAME,DEPLOY_DIR,APP_PORT,PM2_NAME,ADMIN_PASSWORD
          script: |
            set -e
            cd "$DEPLOY_DIR"

            echo "📦 Installation des dépendances..."
            npm ci --omit=dev

            mkdir -p public/uploads public/media data/backups

            echo "⚡ PM2 ($PM2_NAME, port $APP_PORT)..."
            export PORT="$APP_PORT" NODE_ENV="$ENV_NAME" ADMIN_PASSWORD="$ADMIN_PASSWORD"

            if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
              pm2 restart "$PM2_NAME" --update-env
            else
              pm2 start server/index.js --name "$PM2_NAME"
            fi
            pm2 save

            echo "✅ Déploiement [$ENV_NAME] terminée vv"